readme = "README.md"
authors = [
    { name = "mgmarques", email = "mgmarques3000@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "colorama>=0.4.6",
    "dotenv>=0.9.9",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.162.0",
    "grandalf>=0.8",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.3",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "mcp>=2.3.0",
    "pyppeteer>=0.0.25",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
master-rag = "master_rag:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]

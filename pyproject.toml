[project]
name = "master-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mgmarques", email = "mgmarques3000@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bs4>=0.0.2",
    "chromadb>=1.5.9",
    "colorama>=0.4.6",
    "coverage>=7.17.0",
    "dotenv>=0.9.9",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.162.0",
    "grandalf>=0.8",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.3",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "langchain[mcp]>=1.4.8",
    "langchainhub==0.1.20",
    "langgraph>=1.2.19",
    "mcp>=2.3.0",
    "pyppeteer>=0.0.25",
    "requests>=2.34.2",
    "tdqm>=0.0.1",
    "tiktoken>=0.14.0",
    "torch>=2.15.0",
    "transformers>=5.22.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
master-rag = "master_rag:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "notebook>=7.6.4",
]
